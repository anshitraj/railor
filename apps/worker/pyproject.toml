[project]
name = "railor-worker"
version = "0.1.0"
description = "Railor ingestion worker — fetch, extract, normalize, diff and queue provider capability changes."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
# Browser rendering is a last resort, not the default path.
browser = ["playwright>=1.45"]
# Scrapy is used for multi-page documentation crawls.
crawl = ["scrapy>=2.11"]
queue = ["redis>=5.0", "celery>=5.4"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
railor-worker = "railor_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
