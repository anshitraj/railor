<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbefe6"/><stop offset="1" stop-color="#f2cdb5"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#151310" opacity=".07"/></pattern>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3a2410" flood-opacity=".16"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3a2410" flood-opacity=".08"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3a2410" flood-opacity=".14"/></filter>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#c8901c"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9dee6"/><stop offset="1" stop-color="#a7b0bd"/></linearGradient>
<linearGradient id="orangeFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
</defs>
<rect width="1200" height="440" fill="url(#bg)"/>
<rect width="1200" height="440" fill="url(#dots)"/>
<ellipse cx="600" cy="230" rx="520" ry="200" fill="url(#glow)" opacity=".55"/>
<!-- receipt -->
<g filter="url(#lift)"><path d="M170 54 H520 V360 l-25 18 -25 -18 -25 18 -25 -18 -25 18 -25 -18 -25 18 -25 -18 -25 18 -25 -18 -25 18 -25 -18 -25 18 -25 -18 Z" fill="#fff"/></g>
<text x="200" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#151310" text-anchor="start" letter-spacing="0">Transfer summary</text>
<line x1="200" y1="120" x2="490" y2="120" stroke="#eadfcf" stroke-width="2"/>
<text x="200" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#8a8178" text-anchor="start" letter-spacing="0">You send</text><text x="490" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#151310" text-anchor="end" letter-spacing="0">1,000.00 USD</text>
<text x="200" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#8a8178" text-anchor="start" letter-spacing="0">Transfer fee</text><text x="490" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f8a4c" text-anchor="end" letter-spacing="0">0.00 USD</text>
<rect x="200" y="216" width="82" height="27" rx="13.5" fill="#dcf3e4"/><text x="241" y="232" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1f8a4c" text-anchor="middle" letter-spacing="0">“No fee”</text>
<text x="200" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#8a8178" text-anchor="start" letter-spacing="0">Exchange rate</text><text x="490" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#151310" text-anchor="end" letter-spacing="0">1 USD = 90.10</text>
<rect x="196" y="300" width="298" height="34" rx="8" fill="#fff1e7"/><text x="206" y="323" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start" letter-spacing="0">Markup hidden in the rate</text>
<!-- magnifier over the cost bar -->
<g filter="url(#lift)"><rect x="620" y="120" width="440" height="210" rx="22" fill="#ffffff"/></g>
<text x="650" y="166" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#151310" text-anchor="start" letter-spacing="0">What it really costs</text>
<text x="650" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#8a8178" text-anchor="start" letter-spacing="0">Measured against the mid-market rate</text>
<rect x="650" y="222" width="380" height="26" rx="13" fill="#f3ebe0"/>
<rect x="650" y="222" width="70" height="26" rx="13" fill="#151310"/><rect x="706" y="222" width="174" height="26" fill="url(#orangeFill)"/><rect x="866" y="222" width="20" height="26" rx="13" fill="#c2410c"/>
<circle cx="664" cy="282" r="7" fill="#151310"/><text x="678" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#3d3832" text-anchor="start" letter-spacing="0">Fee</text>
<circle cx="744" cy="282" r="7" fill="#e95a2c"/><text x="758" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#3d3832" text-anchor="start" letter-spacing="0">Exchange-rate markup</text>
<text x="1030" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#c2410c" text-anchor="end" letter-spacing="0">2.2%</text>
<g filter="url(#soft)"><circle cx="560" cy="300" r="62" fill="#fff" opacity=".35" stroke="#151310" stroke-width="12"/><path d="M604 344 L650 392" stroke="#151310" stroke-width="18" stroke-linecap="round"/></g>
<g transform="rotate(12 1110 82)" filter="url(#soft)">
<circle cx="1110" cy="85.8" r="38" fill="#c8901c"/>
<circle cx="1110" cy="82" r="38" fill="url(#gold)"/>
<circle cx="1110" cy="82" r="30.400000000000002" fill="none" stroke="#b7801a" stroke-width="1.9000000000000001" opacity=".55"/>
<text x="1110" y="94.92" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="36.1" font-weight="800" fill="#8a5a06" text-anchor="middle" letter-spacing="0">%</text>
</g>
</svg>