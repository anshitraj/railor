<rect x="178" y="296" width="140" height="44" rx="22" fill="#e95a2c"/><text x="248" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">Compare</text>
