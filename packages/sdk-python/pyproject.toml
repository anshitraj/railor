[project]
name = "railor"
version = "0.1.0"
description = "Python client for the Railor API — financial infrastructure, mapped."
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railor"]
