name: Controlled production migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-database
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require explicit migration credentials
        run: test -n "$DATABASE_URL"
      # Hosted databases are never migrated implicitly: list what is pending, then apply it deliberately.
      - run: pnpm db:migrate -- --dry-run
      - run: pnpm db:migrate -- --confirm-remote
